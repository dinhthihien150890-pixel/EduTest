<style>
:root {
 --site-primary:#1d4ed8; --site-secondary:#dbeafe; --site-background:#f3f6fc;
 --site-on-primary:#ffffff; --site-on-secondary:#1e3a8a; --site-on-background:#172033;

}
*{box-sizing:border-box} body{margin:0;font-family:var(--site-font-body);background:light-dark(#f3f6fc,#101827);color:light-dark(#172033,#edf2ff)}
#app{min-height:100vh;width:100%;background-color:var(--site-background);color:var(--site-on-background);border-radius:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(16px * var(--site-spacing-scale)) calc(24px * var(--site-spacing-scale));background:var(--site-primary);color:var(--site-on-primary);gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px;letter-spacing:-.4px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#ffffff25;font-size:22px}.brand small{display:block;font-weight:500;font-size:11px;opacity:.8;letter-spacing:.5px;margin-top:2px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top-actions select{background:#ffffff18;color:white;border:1px solid #ffffff50}.top-actions option{color:#172033}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 72px)}
.sidebar{background:light-dark(#fff,#172033);border-right:1px solid light-dark(#e4eaf4,#2d3b50);padding:20px 14px}.side-label{text-transform:uppercase;letter-spacing:1.2px;font-size:10px;font-weight:800;color:light-dark(#8490a6,#9ca9bd);padding:8px 12px}.navbtn{width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:12px;border-radius:calc(12px * var(--site-radius-scale));font:600 13px var(--site-font-body);display:flex;gap:11px;align-items:center;cursor:pointer;margin:2px 0}.navbtn:hover{background:var(--site-secondary);color:var(--site-on-secondary)}.navbtn.active{background:var(--site-primary);color:var(--site-on-primary);box-shadow:0 6px 16px #1d4ed82b}.navicon{width:22px;text-align:center;font-size:17px}.sidebar-note{margin:28px 6px 0;padding:14px;border-radius:14px;background:var(--site-secondary);color:var(--site-on-secondary);font-size:12px;line-height:1.5}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.eyebrow{color:var(--site-primary);font-size:11px;font-weight:850;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}.heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}.heading-row h1{font-family:var(--site-font-heading);font-size:calc(28px * var(--site-heading-scale));letter-spacing:-.8px;margin:0 0 7px}.muted{color:light-dark(#69758a,#aab6ca);font-size:13px}.btn{border:1px solid light-dark(#d9e1ef,#40506a);background:light-dark(#fff,#202e44);color:inherit;padding:10px 14px;border-radius:calc(10px * var(--site-radius-scale));font-weight:750;font-size:12px;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}.btn.primary{background:var(--site-primary);border-color:var(--site-primary);color:var(--site-on-primary)}.btn.soft{background:var(--site-secondary);color:var(--site-on-secondary);border-color:transparent}.btn.danger{color:#b42318;border-color:#f0c9c5;background:#fff8f7}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{background:light-dark(#fff,#172033);border:1px solid light-dark(#e4eaf4,#2d3b50);border-radius:calc(16px * var(--site-radius-scale));padding:18px;box-shadow:0 5px 20px #1b2b4a06}.stat-top{display:flex;justify-content:space-between;align-items:center;color:light-dark(#65728a,#aab6ca);font-size:12px;font-weight:650}.stat-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:var(--site-secondary);color:var(--site-on-secondary);font-size:17px}.stat-value{font-size:29px;font-weight:850;letter-spacing:-.8px;margin:12px 0 4px}.stat-foot{font-size:11px;color:light-dark(#78859a,#aab6ca)}.stat-foot strong{color:#16855b}.panel{background:light-dark(#fff,#172033);border:1px solid light-dark(#e4eaf4,#2d3b50);border-radius:calc(16px * var(--site-radius-scale));padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #1b2b4a06}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.panel h2{font-size:16px;margin:0;font-weight:800}.panel-sub{font-size:12px;color:light-dark(#77839a,#aab6ca);margin-top:5px}.filters{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea{font:inherit;color:inherit;background:light-dark(#fff,#111b2a);border:1px solid light-dark(#d9e1ef,#40506a);border-radius:9px;padding:10px 11px;font-size:12px;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;outline-offset:1px}.filters input,.filters select{max-width:220px}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;text-transform:uppercase;letter-spacing:.5px;color:light-dark(#748198,#aab6ca);font-size:10px;background:light-dark(#f8faff,#1b293e);padding:12px 10px;border-bottom:1px solid light-dark(#e4eaf4,#2d3b50)}td{padding:13px 10px;border-bottom:1px solid light-dark(#edf0f6,#2b374a);vertical-align:middle}tr:last-child td{border-bottom:0}.student{display:flex;align-items:center;gap:9px;font-weight:750}.avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--site-secondary);color:var(--site-on-secondary);font-size:11px;font-weight:850}.pill{display:inline-flex;padding:5px 8px;border-radius:30px;font-size:10px;font-weight:800;white-space:nowrap}.pill.green{background:#dcfce7;color:#166534}.pill.blue{background:#dbeafe;color:#1d4ed8}.pill.amber{background:#fef3c7;color:#92400e}.pill.gray{background:#e9edf4;color:#4b5563}.pill.red{background:#fee2e2;color:#991b1b}.two-col{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:18px}.barrow{display:grid;grid-template-columns:85px 1fr 34px;gap:10px;align-items:center;margin:15px 0;font-size:12px}.bartrack{height:9px;background:light-dark(#edf1f8,#29374b);border-radius:10px;overflow:hidden}.barfill{height:100%;border-radius:10px;background:var(--site-primary)}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick{border:1px solid light-dark(#e4eaf4,#2d3b50);border-radius:13px;padding:16px;cursor:pointer;background:light-dark(#fff,#172033);text-align:left;color:inherit}.quick:hover{border-color:var(--site-primary);background:light-dark(#f8fbff,#1b2a40)}.quick-icon{font-size:20px;margin-bottom:12px}.quick strong{display:block;font-size:13px;margin-bottom:5px}.quick span{font-size:11px;color:light-dark(#748198,#aab6ca);line-height:1.5}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:750}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}.help{font-size:11px;color:light-dark(#7b879b,#aab6ca);line-height:1.45}.exam-card{border:1px solid light-dark(#e4eaf4,#2d3b50);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start;background:light-dark(#fff,#172033);margin:10px 0}.exam-symbol{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;background:var(--site-secondary);color:var(--site-on-secondary);font-size:20px}.exam-info{flex:1;min-width:0}.exam-info h3{font-size:14px;margin:1px 0 7px}.exam-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:light-dark(#748198,#aab6ca)}.exam-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:30px;color:light-dark(#7b879b,#aab6ca);font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#0b1325a8;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:light-dark(#fff,#172033);color:light-dark(#172033,#edf2ff);border-radius:18px;max-width:700px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 25px 80px #0004}.modal h2{margin:0 0 7px;font-size:20px}.modal-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px}.xbtn{border:0;background:transparent;font-size:24px;cursor:pointer;color:inherit}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:#14243b;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 10px 30px #0003;z-index:20;display:none;font-size:13px;max-width:360px}.toast.show{display:block;animation:up .2s ease}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.student-shell{max-width:900px;margin:0 auto}.student-hero{background:var(--site-primary);color:white;padding:24px;border-radius:16px;margin-bottom:18px}.student-hero h2{margin:0 0 7px;font-size:23px}.quiz-q{border:1px solid light-dark(#e4eaf4,#2d3b50);border-radius:13px;padding:18px;margin:14px 0;background:light-dark(#fff,#172033)}.quiz-q h3{font-size:14px;margin:0 0 14px}.choice{display:flex;gap:10px;align-items:center;border:1px solid light-dark(#e4eaf4,#2d3b50);padding:11px;border-radius:10px;margin:7px 0;cursor:pointer;font-size:12px}.choice:has(input:checked){border-color:var(--site-primary);background:var(--site-secondary);color:var(--site-on-secondary)}.choice input{accent-color:var(--site-primary)}.timer{font-variant-numeric:tabular-nums;background:#fff;color:#1d4ed8;border-radius:10px;padding:9px 13px;font-size:18px;font-weight:850}.result-score{font-size:54px;font-weight:900;letter-spacing:-2px;color:var(--site-primary)}.notice{padding:13px 15px;background:var(--site-secondary);color:var(--site-on-secondary);border-radius:11px;font-size:12px;line-height:1.55;margin:14px 0}.hidden{display:none!important}.footnote{font-size:10px;color:light-dark(#8490a6,#aab6ca);margin-top:18px;line-height:1.5}
@media(max-width:1000px){.layout{grid-template-columns:200px minmax(0,1fr)}.main{padding:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media(max-width:680px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid light-dark(#e4eaf4,#2d3b50);padding:8px;display:flex;overflow:auto;gap:4px}.side-label,.sidebar-note{display:none}.navbtn{width:auto;white-space:nowrap;padding:10px;font-size:11px}.navicon{display:none}.main{padding:15px}.topbar{padding:13px 16px}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:24px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick-grid{grid-template-columns:1fr}.heading-row h1{font-size:24px}table{min-width:680px}.table-wrap{overflow:auto}.filters input,.filters select{max-width:100%;flex:1}.exam-card{flex-wrap:wrap}.exam-actions{width:100%}}
</style></head>
<body><div id="app">
<header class="topbar"><div class="brand"><div class="logo">✓</div><div>EduTest<small>QUẢN LÝ KIỂM TRA TRỰC TUYẾN</small></div></div><div class="top-actions"><select id="roleSelect" aria-label="Chọn chế độ"><option value="teacher">👩‍🏫 Chế độ giáo viên</option><option value="student">🎓 Chế độ học sinh</option></select><button class="btn" id="resetDemo" style="background:#ffffff18;color:white;border-color:#ffffff50">↻ Làm mới dữ liệu mẫu</button></div></header>
<div class="layout"><aside class="sidebar" id="sidebar"><div class="side-label">Không gian làm việc</div><button class="navbtn active" data-page="dashboard"><span class="navicon">▦</span>Tổng quan</button><button class="navbtn" data-page="exams"><span class="navicon">▤</span>Đề kiểm tra</button><button class="navbtn" data-page="results"><span class="navicon">◷</span>Kết quả học sinh</button><button class="navbtn" data-page="classes"><span class="navicon">♧</span>Thống kê lớp</button><button class="navbtn" data-page="settings"><span class="navicon">⚙</span>Thông tin kỳ thi</button><div class="sidebar-note"><strong>✦ Bản trải nghiệm tương tác</strong><br>Thao tác trên dữ liệu mẫu. Có thể tạo đề, làm bài, nộp bài và xuất bảng kết quả.</div></aside><main class="main" id="main"></main></div>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal"></section></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const initialExams=[
{id:1,title:'Kiểm tra giữa học kỳ I',subject:'Toán',grade:'9',year:'2026–2027',duration:45,questions:10,status:'Đang mở',open:'2026-10-20T07:00',close:'2026-11-05T23:00',classes:['9A1','9A2'],desc:'Ôn tập kiến thức trọng tâm giữa học kỳ I.',items:[{q:'Nghiệm của phương trình 2x + 4 = 10 là:',opts:['x = 2','x = 3','x = 4','x = 7'],ans:1},{q:'Giá trị của sin 30° bằng:',opts:['0','1/2','√2/2','1'],ans:1},{q:'Cặp số nào là nghiệm của hệ x + y = 5; x − y = 1?',opts:['(2;3)','(3;2)','(4;1)','(1;4)'],ans:1},{q:'Căn bậc hai số học của 81 là:',opts:['−9','9','±9','8'],ans:1},{q:'Nếu tam giác ABC vuông tại A thì cạnh huyền là:',opts:['AB','AC','BC','Không xác định'],ans:2}]},
{id:2,title:'Ôn tập hàm số bậc nhất',subject:'Toán',grade:'9',year:'2026–2027',duration:20,questions:5,status:'Bản nháp',open:'2026-10-27T07:00',close:'2026-11-20T23:00',classes:['9A1'],desc:'Bài luyện tập ngắn.',items:[{q:'Hàm số y = 2x + 1 có hệ số góc là:',opts:['1','2','−2','0'],ans:1},{q:'Điểm nào thuộc đồ thị y = x + 2?',opts:['(0;0)','(1;3)','(2;1)','(−2;2)'],ans:1},{q:'Đồ thị y = ax + b (a khác 0) là:',opts:['Đường tròn','Parabol','Đường thẳng','Elip'],ans:2},{q:'Khi x = 0 thì y = 3x − 4 bằng:',opts:['3','4','−4','0'],ans:2},{q:'Hai đường thẳng song song có hệ số góc:',opts:['Bằng nhau','Đối nhau','Tích bằng 1','Luôn bằng 0'],ans:0}]}
];
const initialResults=[
{id:1,name:'Nguyễn Minh Anh',class:'9A1',year:'2026–2027',exam:'Kiểm tra giữa học kỳ I',subject:'Toán',score:9,duration:32,status:'Đã nộp',date:'26/10/2026',correct:9,total:10},
{id:2,name:'Trần Gia Bảo',class:'9A1',year:'2026–2027',exam:'Kiểm tra giữa học kỳ I',subject:'Toán',score:8,duration:38,status:'Đã nộp',date:'26/10/2026',correct:8,total:10},
{id:3,name:'Lê Ngọc Hà',class:'9A2',year:'2026–2027',exam:'Kiểm tra giữa học kỳ I',subject:'Toán',score:7,duration:40,status:'Đã nộp',date:'26/10/2026',correct:7,total:10},
{id:4,name:'Phạm Quốc Huy',class:'9A1',year:'2026–2027',exam:'Kiểm tra giữa học kỳ I',subject:'Toán',score:6,duration:44,status:'Đã nộp',date:'26/10/2026',correct:6,total:10},
{id:5,name:'Võ Thảo My',class:'9A2',year:'2026–2027',exam:'Kiểm tra giữa học kỳ I',subject:'Toán',score:10,duration:29,status:'Đã nộp',date:'26/10/2026',correct:10,total:10},
{id:6,name:'Đặng Tuấn Kiệt',class:'9A2',year:'2026–2027',exam:'Kiểm tra giữa học kỳ I',subject:'Toán',score:0,duration:0,status:'Chưa làm',date:'—',correct:0,total:10},
{id:7,name:'Nguyễn Minh Anh',class:'9A1',year:'2026–2027',exam:'Ôn tập hàm số bậc nhất',subject:'Toán',score:8,duration:14,status:'Đã nộp',date:'26/10/2026',correct:4,total:5},
{id:8,name:'Trần Gia Bảo',class:'9A1',year:'2026–2027',exam:'Ôn tập hàm số bậc nhất',subject:'Toán',score:6,duration:18,status:'Đã nộp',date:'26/10/2026',correct:3,total:5},
{id:9,name:'Lê Ngọc Hà',class:'9A2',year:'2026–2027',exam:'Ôn tập hàm số bậc nhất',subject:'Toán',score:10,duration:12,status:'Đã nộp',date:'26/10/2026',correct:5,total:5}
];
let exams=structuredClone(initialExams),results=structuredClone(initialResults),page='dashboard',nextExam=3,nextResult=10,activeQuiz=null,quizStart=0,quizTimer=null,quizSeconds=0,quizStudent=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n).toLocaleString('vi-VN',{maximumFractionDigits:1})}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0}
function pill(status){let c=status==='Đã nộp'?'green':status==='Đang mở'?'green':status==='Bản nháp'?'gray':status==='Chưa làm'?'amber':status==='Đã đóng'?'red':'blue';return `<span class="pill ${c}">${esc(status)}</span>`}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2800)}
function setPage(p){page=p;$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function statsFor(rs){let done=rs.filter(r=>r.status==='Đã nộp');return {done,mean:avg(done.map(r=>r.score)),hi:done.length?Math.max(...done.map(r=>r.score)):0,lo:done.length?Math.min(...done.map(r=>r.score)):0}}
function render(){if($('#roleSelect').value==='student'){renderStudentHome();return}let main=$('#main');if(page==='dashboard')main.innerHTML=dashboard();else if(page==='exams')main.innerHTML=examsPage();else if(page==='results')main.innerHTML=resultsPage();else if(page==='classes')main.innerHTML=classesPage();else main.innerHTML=settingsPage();bindPage()}
function dashboard(){let done=results.filter(r=>r.status==='Đã nộp'),active=exams.filter(e=>e.status==='Đang mở').length,mean=avg(done.map(r=>r.score));return `<div class="heading-row"><div><div class="eyebrow">Bảng điều khiển / Năm học 2026–2027</div><h1>Chào mừng trở lại! 👋</h1><div class="muted">Theo dõi kỳ thi, tiến độ làm bài và kết quả học tập ở một nơi.</div></div><button class="btn primary" data-action="new-exam">＋ Tạo đề kiểm tra</button></div>
<div class="stats"><div class="stat"><div class="stat-top">Đề kiểm tra <span class="stat-icon">▤</span></div><div class="stat-value">${exams.length}</div><div class="stat-foot"><strong>${active} đề</strong> đang mở</div></div><div class="stat"><div class="stat-top">Lượt nộp bài <span class="stat-icon">✓</span></div><div class="stat-value">${done.length}</div><div class="stat-foot">Trên ${results.length} bản ghi mẫu</div></div><div class="stat"><div class="stat-top">Điểm trung bình <span class="stat-icon">◉</span></div><div class="stat-value">${mean.toFixed(1)}<span style="font-size:14px;color:#8490a6">/10</span></div><div class="stat-foot">Tính trên bài đã nộp</div></div><div class="stat"><div class="stat-top">Lớp tham gia <span class="stat-icon">♧</span></div><div class="stat-value">2</div><div class="stat-foot">9A1 và 9A2</div></div></div>
<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Đề kiểm tra gần đây</h2><div class="panel-sub">Quản lý nhanh trạng thái đề</div></div><button class="btn" data-page="exams">Xem tất cả →</button></div>${exams.slice(0,3).map(e=>`<div class="exam-card"><div class="exam-symbol">📝</div><div class="exam-info"><h3>${esc(e.title)}</h3><div class="exam-meta"><span>📘 ${esc(e.subject)} · Lớp ${esc(e.grade)}</span><span>⏱ ${e.duration} phút</span><span>❔ ${e.questions} câu</span></div><div style="margin-top:10px">${pill(e.status)}</div><div class="exam-actions"><button class="btn soft" data-action="edit-exam" data-id="${e.id}">Chỉnh sửa</button><button class="btn" data-action="copy-link" data-id="${e.id}">Sao chép link thi</button></div></div></div>`).join('')}</section>
<section class="panel"><div class="panel-head"><div><h2>Phân bố điểm</h2><div class="panel-sub">Bài đã nộp · thang điểm 10</div></div></div>${[['Dưới 5',done.filter(r=>r.score<5).length],['5 – dưới 7',done.filter(r=>r.score>=5&&r.score<7).length],['7 – dưới 9',done.filter(r=>r.score>=7&&r.score<9).length],['9 – 10',done.filter(r=>r.score>=9).length]].map(([lab,n])=>`<div class="barrow"><span>${lab}</span><div class="bartrack"><div class="barfill" style="width:${done.length?n/done.length*100:0}%"></div></div><strong>${n}</strong></div>`).join('')}<div class="notice">💡 Mẹo: vào <b>Thống kê lớp</b> để so sánh điểm trung bình, tỷ lệ nộp bài và phân bố kết quả giữa các lớp.</div></section></div>
<section class="panel"><div class="panel-head"><div><h2>Hoạt động mới nhất</h2><div class="panel-sub">Các lượt làm bài gần đây</div></div><button class="btn" data-page="results">Mở sổ điểm →</button></div>${results.filter(r=>r.status==='Đã nộp').slice(0,5).map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid light-dark(#edf0f6,#2b374a)"><div class="avatar">${esc(r.name.split(' ').slice(-1)[0].slice(0,1))}</div><div style="flex:1"><strong style="font-size:12px">${esc(r.name)}</strong><div class="muted" style="font-size:11px;margin-top:4px">${esc(r.exam)} · ${esc(r.class)}</div></div><strong style="color:var(--site-primary)">${r.score}/10</strong><span class="muted">${r.duration} phút</span></div>`).join('')}</section>`}
function examsPage(){return `<div class="heading-row"><div><div class="eyebrow">Ngân hàng đề</div><h1>Đề kiểm tra</h1><div class="muted">Tạo, chỉnh sửa, mở/đóng đề và chia sẻ liên kết cho học sinh.</div></div><button class="btn primary" data-action="new-exam">＋ Tạo đề mới</button></div><section class="panel"><div class="panel-head"><div><h2>Danh sách đề</h2><div class="panel-sub">${exams.length} đề trong không gian mẫu</div></div><div class="filters"><input id="examSearch" placeholder="Tìm tên đề, môn học…"><select id="examStatus"><option value="">Tất cả trạng thái</option><option>Đang mở</option><option>Bản nháp</option><option>Đã đóng</option></select></div></div><div id="examList">${examListHtml(exams)}</div></section><div class="notice">🔗 <b>Liên kết thi:</b> nút “Sao chép link thi” tạo liên kết minh họa cho bản xem trước. Khi triển khai thật, mỗi học sinh có thể mở link trên thiết bị riêng và kết quả được lưu tập trung.</div>`}
function examListHtml(list){if(!list.length)return '<div class="empty">Không tìm thấy đề phù hợp.</div>';return list.map(e=>`<div class="exam-card"><div class="exam-symbol">📝</div><div class="exam-info"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(e.title)}</h3>${pill(e.status)}</div><div class="exam-meta"><span>📘 ${esc(e.subject)}</span><span>🎓 Lớp ${esc(e.grade)}</span><span>📅 ${esc(e.year)}</span><span>⏱ ${e.duration} phút</span><span>❔ ${e.questions} câu</span></div><div class="exam-meta" style="margin-top:8px"><span>Mở: ${esc(e.open.replace('T',' '))}</span><span>Đóng: ${esc(e.close.replace('T',' '))}</span></div><div class="exam-actions"><button class="btn soft" data-action="edit-exam" data-id="${e.id}">✎ Chỉnh sửa</button><button class="btn" data-action="copy-link" data-id="${e.id}">↗ Sao chép link thi</button><button class="btn" data-action="toggle-exam" data-id="${e.id}">${e.status==='Đang mở'?'⏸ Đóng đề':'▶ Mở đề'}</button><button class="btn danger" data-action="delete-exam" data-id="${e.id}">Xóa</button></div></div></div>`).join('')}
function resultsPage(){let names=[...new Set(results.map(r=>r.name))],examNames=[...new Set(results.map(r=>r.exam))];return `<div class="heading-row"><div><div class="eyebrow">Sổ điểm điện tử</div><h1>Kết quả học sinh</h1><div class="muted">Tra cứu theo học sinh, lớp, năm học và bài kiểm tra; xuất bảng tính để tổng hợp.</div></div><button class="btn primary" data-action="export-results">⇩ Xuất Excel (CSV)</button></div><section class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><div class="stat-top">Đã nộp</div><div class="stat-value">${results.filter(r=>r.status==='Đã nộp').length}</div><div class="stat-foot">Lượt làm bài hoàn tất</div></div><div class="stat"><div class="stat-top">Chưa làm</div><div class="stat-value">${results.filter(r=>r.status!=='Đã nộp').length}</div><div class="stat-foot">Cần theo dõi</div></div><div class="stat"><div class="stat-top">Điểm trung bình</div><div class="stat-value">${statsFor(results).mean.toFixed(1)}</div><div class="stat-foot">Trên thang 10</div></div></section><section class="panel"><div class="panel-head"><div><h2>Bảng kết quả chi tiết</h2><div class="panel-sub">Có thể lọc và xem hồ sơ điểm theo từng học sinh.</div></div></div><div class="filters" style="margin-bottom:16px"><input id="resultSearch" placeholder="Tìm tên học sinh…"><select id="resultClass"><option value="">Tất cả lớp</option><option>9A1</option><option>9A2</option></select><select id="resultExam"><option value="">Tất cả đề</option>${examNames.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="resultStatus"><option value="">Tất cả trạng thái</option><option>Đã nộp</option><option>Chưa làm</option></select></div><div class="table-wrap"><table><thead><tr><th>Học sinh</th><th>Lớp / Năm học</th><th>Bài kiểm tra</th><th>Điểm</th><th>Thời gian</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody id="resultRows">${resultRowsHtml(results)}</tbody></table></div></section><div class="footnote">Lưu ý: đây là dữ liệu minh họa cho bản xem trước; điểm trong dữ liệu mẫu không phải kết quả học sinh thật.</div>`}
function resultRowsHtml(list){return list.length?list.map(r=>`<tr><td><div class="student"><span class="avatar">${esc(r.name.split(' ').slice(-1)[0].slice(0,1))}</span>${esc(r.name)}</div></td><td>${esc(r.class)}<div class="muted" style="font-size:10px;margin-top:4px">${esc(r.year)}</div></td><td>${esc(r.exam)}<div class="muted" style="font-size:10px;margin-top:4px">${esc(r.subject)}</div></td><td><strong style="color:${r.status==='Đã nộp'?'var(--site-primary)':'#a0a8b8'}">${r.status==='Đã nộp'?r.score+'/10':'—'}</strong></td><td>${r.duration?r.duration+' phút':'—'}</td><td>${pill(r.status)}</td><td><button class="btn" data-action="student-detail" data-id="${r.id}">Xem</button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">Không có kết quả phù hợp.</div></td></tr>'}
function classesPage(){let cls=['9A1','9A2'];return `<div class="heading-row"><div><div class="eyebrow">Báo cáo tổng hợp</div><h1>Thống kê lớp học</h1><div class="muted">So sánh số lượt nộp, điểm trung bình và phân bố kết quả theo lớp.</div></div><button class="btn primary" data-action="export-classes">⇩ Xuất thống kê CSV</button></div><section class="panel"><div class="panel-head"><div><h2>So sánh kết quả giữa các lớp</h2><div class="panel-sub">Tổng hợp từ tất cả bài kiểm tra mẫu đã ghi nhận</div></div><select id="classExamFilter"><option value="">Tất cả bài kiểm tra</option>${[...new Set(results.map(r=>r.exam))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Lượt nộp</th><th>Chưa làm</th><th>Điểm TB</th><th>Cao nhất</th><th>Thấp nhất</th><th>Tỷ lệ 7+</th></tr></thead><tbody id="classRows">${classRowsHtml('')}</tbody></table></div></section><div class="two-col"><section class="panel"><h2>Điểm trung bình theo lớp</h2><div class="panel-sub">Điểm trên thang 10</div><div id="classBars">${classBarsHtml('')}</div></section><section class="panel"><h2>Phân bố điểm toàn bộ</h2><div class="panel-sub">Chỉ tính lượt đã nộp</div>${[['Dưới 5',results.filter(r=>r.status==='Đã nộp'&&r.score<5).length],['5 – dưới 7',results.filter(r=>r.status==='Đã nộp'&&r.score>=5&&r.score<7).length],['7 – dưới 9',results.filter(r=>r.status==='Đã nộp'&&r.score>=7&&r.score<9).length],['9 – 10',results.filter(r=>r.status==='Đã nộp'&&r.score>=9).length]].map(([l,n])=>`<div class="barrow"><span>${l}</span><div class="bartrack"><div class="barfill" style="width:${n/Math.max(1,results.filter(r=>r.status==='Đã nộp').length)*100}%"></div></div><strong>${n}</strong></div>`).join('')}</section></div>`}
function classRowsHtml(exam){return ['9A1','9A2'].map(c=>{let all=results.filter(r=>r.class===c&&(!exam||r.exam===exam)),s=statsFor(all);return `<tr><td><strong>${c}</strong></td><td>${s.done.length}</td><td>${all.filter(r=>r.status!=='Đã nộp').length}</td><td><strong>${s.mean.toFixed(1)}</strong></td><td>${s.hi.toFixed(1)}</td><td>${s.lo.toFixed(1)}</td><td>${s.done.length?(s.done.filter(r=>r.score>=7).length/s.done.length*100).toFixed(0)+'%':'—'}</td></tr>`}).join('')}
function classBarsHtml(exam){return ['9A1','9A2'].map(c=>{let s=statsFor(results.filter(r=>r.class===c&&(!exam||r.exam===exam)));return `<div class="barrow"><span>${c}</span><div class="bartrack"><div class="barfill" style="width:${s.mean*10}%"></div></div><strong>${s.mean.toFixed(1)}</strong></div>`}).join('')}
function settingsPage(){return `<div class="heading-row"><div><div class="eyebrow">Cấu hình</div><h1>Thông tin kỳ thi</h1><div class="muted">Thông tin mặc định hiển thị trong không gian làm việc mẫu.</div></div></div><section class="panel"><div class="panel-head"><div><h2>Thông tin nhà trường và năm học</h2><div class="panel-sub">Các trường dưới đây có thể chỉnh sửa trong phiên trải nghiệm.</div></div></div><form id="settingsForm"><div class="formgrid"><div class="field"><label>Tên đơn vị</label><input name="school" value="Trường TH&THCS Tây Sơn" required></div><div class="field"><label>Năm học</label><select name="year"><option>2026–2027</option><option>2025–2026</option><option>2027–2028</option></select></div><div class="field"><label>Người quản lý</label><input name="manager" value="Giáo viên bộ môn / GVCN"></div><div class="field"><label>Môn học mặc định</label><select name="subject"><option>Toán</option><option>Ngữ văn</option><option>Tiếng Anh</option><option>Tin học</option><option>Khoa học tự nhiên</option><option>Lịch sử và Địa lí</option></select></div></div><div style="margin-top:18px"><button class="btn primary">Lưu thông tin mẫu</button></div></form></section><section class="panel"><h2>Những tính năng của bản xem trước</h2><div class="quick-grid" style="margin-top:16px"><div class="quick"><div class="quick-icon">🧾</div><strong>Tạo và chỉnh sửa đề</strong><span>Nhập tiêu đề, môn, lớp, năm học, thời gian, lịch mở/đóng và câu hỏi trắc nghiệm.</span></div><div class="quick"><div class="quick-icon">⏱️</div><strong>Làm bài có tính giờ</strong><span>Học sinh nhập thông tin, chọn đáp án, nộp bài và xem điểm minh họa.</span></div><div class="quick"><div class="quick-icon">📊</div><strong>Thống kê và xuất dữ liệu</strong><span>Lọc kết quả theo học sinh, lớp, đề thi và tải CSV mở bằng Excel.</span></div></div><div class="notice">🔐 Để dùng chính thức cần bổ sung đăng nhập/phân quyền, cơ sở dữ liệu, chấm tự luận, chống gian lận và lưu bài an toàn. Không dùng dữ liệu mẫu làm sổ điểm thật.</div></section>`}
function bindPage(){ $$('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));let es=$('#examSearch'),st=$('#examStatus');if(es) [es,st].forEach(x=>x.addEventListener('input',()=>{let list=exams.filter(e=>(!es.value||(e.title+' '+e.subject).toLowerCase().includes(es.value.toLowerCase()))&&(!st.value||e.status===st.value));$('#examList').innerHTML=examListHtml(list);bindActionsOnly()}));let rSearch=$('#resultSearch');if(rSearch){['resultSearch','resultClass','resultExam','resultStatus'].forEach(id=>$('#'+id).addEventListener('input',filterResults))}let cf=$('#classExamFilter');if(cf)cf.onchange=()=>{$('#classRows').innerHTML=classRowsHtml(cf.value);$('#classBars').innerHTML=classBarsHtml(cf.value)};let sf=$('#settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();toast('Đã lưu thông tin trong phiên xem trước.')}}
function bindActionsOnly(){$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id))}
function filterResults(){let q=$('#resultSearch').value.toLowerCase(),c=$('#resultClass').value,e=$('#resultExam').value,s=$('#resultStatus').value;let list=results.filter(r=>(!q||r.name.toLowerCase().includes(q))&&(!c||r.class===c)&&(!e||r.exam===e)&&(!s||r.status===s));$('#resultRows').innerHTML=resultRowsHtml(list);bindActionsOnly()}
function showModal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('show');$('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){$('#modalBackdrop').classList.remove('show')}$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()}
function action(a,id){let e=exams.find(x=>x.id===Number(id));if(a==='new-exam'||a==='edit-exam')openExamForm(e);if(a==='copy-link'){let link='https://edutest.example/thi/'+(e?.id||'demo');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(link).then(()=>toast('Đã sao chép liên kết minh họa: '+link)).catch(()=>showLink(link));else showLink(link)}if(a==='toggle-exam'){e.status=e.status==='Đang mở'?'Đã đóng':'Đang mở';render();toast('Đã cập nhật trạng thái đề.')}if(a==='delete-exam'){showModal(`<div class="modal-head"><div><h2>Xóa đề kiểm tra?</h2><div class="muted">Bạn có chắc muốn xóa “${esc(e.title)}” khỏi dữ liệu mẫu?</div></div><button class="xbtn" data-close>×</button></div><div class="modal-footer"><button class="btn" data-close>Hủy</button><button class="btn danger" id="confirmDelete">Xóa đề</button></div>`);$('#confirmDelete').onclick=()=>{exams=exams.filter(x=>x.id!==e.id);closeModal();render();toast('Đã xóa đề khỏi phiên xem trước.')}}if(a==='student-detail'){let r=results.find(x=>x.id===Number(id));showModal(`<div class="modal-head"><div><div class="eyebrow">Hồ sơ kết quả</div><h2>${esc(r.name)}</h2><div class="muted">Lớp ${esc(r.class)} · Năm học ${esc(r.year)}</div></div><button class="xbtn" data-close>×</button></div><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><div class="stat-top">Điểm số</div><div class="stat-value">${r.status==='Đã nộp'?r.score:'—'}</div></div><div class="stat"><div class="stat-top">Thời gian</div><div class="stat-value">${r.duration||'—'}<span style="font-size:12px"> phút</span></div></div><div class="stat"><div class="stat-top">Câu đúng</div><div class="stat-value">${r.status==='Đã nộp'?r.correct+'/'+r.total:'—'}</div></div></div><p><b>Bài kiểm tra:</b> ${esc(r.exam)}</p><p><b>Trạng thái:</b> ${pill(r.status)}</p><p><b>Ngày nộp:</b> ${esc(r.date)}</p><div class="modal-footer"><button class="btn" data-close>Đóng</button></div>`)}if(a==='export-results')exportCsv('ket_qua_hoc_sinh.csv',results.map(r=>({HoTen:r.name,Lop:r.class,NamHoc:r.year,BaiKiemTra:r.exam,Mon:r.subject,Diem:r.status==='Đã nộp'?r.score:'',ThoiGianPhut:r.duration,TrangThai:r.status,SoCauDung:r.correct,SoCau:r.total,NgayNop:r.date})));if(a==='export-classes')exportCsv('thong_ke_lop.csv',['9A1','9A2'].map(c=>{let all=results.filter(r=>r.class===c),s=statsFor(all);return {Lop:c,LuotNop:s.done.length,ChuaLam:all.filter(r=>r.status!=='Đã nộp').length,DiemTrungBinh:s.mean.toFixed(2),DiemCaoNhat:s.hi,DiemThapNhat:s.lo}}))}
function showLink(link){showModal(`<div class="modal-head"><div><h2>Liên kết thi minh họa</h2><div class="muted">Liên kết này chỉ là ví dụ, chưa phải đường dẫn thi công khai.</div></div><button class="xbtn" data-close>×</button></div><input style="width:100%" id="linkText" value="${esc(link)}" readonly><div class="modal-footer"><button class="btn" data-close>Đóng</button><button class="btn primary" id="copyText">Sao chép</button></div>`);$('#copyText').onclick=()=>{let i=$('#linkText');i.select();try{document.execCommand('copy')}catch{}toast('Đã chọn liên kết để sao chép.');closeModal()}}
function openExamForm(e){let edit=!!e;showModal(`<div class="modal-head"><div><div class="eyebrow">${edit?'Chỉnh sửa đề':'Ngân hàng đề'}</div><h2>${edit?'Cập nhật đề kiểm tra':'Tạo đề kiểm tra mới'}</h2><div class="muted">Điền thông tin cơ bản. Bạn có thể thêm câu hỏi trắc nghiệm mẫu bên dưới.</div></div><button class="xbtn" data-close>×</button></div><form id="examForm"><div class="formgrid"><div class="field full"><label>Tên bài kiểm tra *</label><input name="title" required value="${esc(e?.title||'')}" placeholder="VD: Kiểm tra giữa học kỳ I"></div><div class="field"><label>Môn học *</label><select name="subject">${['Toán','Ngữ văn','Tiếng Anh','Tin học','Khoa học tự nhiên','Lịch sử và Địa lí'].map(s=>`<option ${e?.subject===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Lớp *</label><select name="grade">${['6','7','8','9'].map(s=>`<option ${String(e?.grade||'9')===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Năm học</label><select name="year">${['2026–2027','2025–2026','2027–2028'].map(s=>`<option ${e?.year===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Thời gian làm bài (phút)</label><input name="duration" type="number" min="1" max="300" value="${e?.duration||45}" required></div><div class="field"><label>Số câu hỏi</label><input name="questions" type="number" min="1" max="100" value="${e?.questions||5}" required></div><div class="field"><label>Trạng thái</label><select name="status"><option ${e?.status==='Bản nháp'?'selected':''}>Bản nháp</option><option ${e?.status==='Đang mở'?'selected':''}>Đang mở</option><option ${e?.status==='Đã đóng'?'selected':''}>Đã đóng</option></select></div><div class="field"><label>Thời điểm mở đề</label><input name="open" type="datetime-local" value="${e?.open||'2026-10-27T07:00'}"></div><div class="field"><label>Thời điểm đóng đề</label><input name="close" type="datetime-local" value="${e?.close||'2026-11-05T23:00'}"></div><div class="field full"><label>Mô tả / hướng dẫn</label><textarea name="desc" rows="2" placeholder="Hướng dẫn học sinh trước khi làm bài">${esc(e?.desc||'')}</textarea></div></div><div class="notice">Câu hỏi sẽ dùng bộ câu hỏi trắc nghiệm mẫu trong bản xem trước. Chức năng nhập Word/PDF, trộn đề và chấm tự luận cần được phát triển thêm khi triển khai chính thức.</div><div class="modal-footer"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary">${edit?'Lưu thay đổi':'Tạo đề kiểm tra'}</button></div></form>`);$('#examForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),v=Object.fromEntries(f.entries());v.duration=Number(v.duration);v.questions=Number(v.questions);v.classes=['9A'+(v.grade==='9'?'1':'')];if(edit){Object.assign(e,v)}else{v.id=nextExam++;v.items=initialExams[0].items.slice(0,Math.min(v.questions,5));exams.unshift(v)}closeModal();page='exams';render();toast(edit?'Đã cập nhật đề kiểm tra.':'Đã tạo đề kiểm tra mới.')}}
function exportCsv(name,rows){if(!rows.length){toast('Không có dữ liệu để xuất.');return}let keys=Object.keys(rows[0]),csv='\ufeff'+[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast('Đã xuất tệp CSV, có thể mở bằng Excel.')}
function renderStudentHome(){let main=$('#main');main.innerHTML=`<div class="student-shell"><div class="heading-row"><div><div class="eyebrow">Cổng học sinh</div><h1>Làm bài kiểm tra trực tuyến</h1><div class="muted">Chọn đề đang mở, nhập thông tin cá nhân và bắt đầu làm bài.</div></div><button class="btn" data-action="student-return">← Quay lại chế độ giáo viên</button></div><section class="panel"><div class="panel-head"><div><h2>Thông tin học sinh</h2><div class="panel-sub">Dữ liệu nhập chỉ dùng trong phiên xem trước.</div></div></div><div class="formgrid"><div class="field"><label>Họ và tên *</label><input id="studentName" placeholder="Nhập họ và tên" value="${esc(quizStudent?.name||'')}"></div><div class="field"><label>Lớp *</label><select id="studentClass"><option>9A1</option><option>9A2</option><option>9A3</option><option>9A4</option></select></div></div></section><section class="panel"><div class="panel-head"><div><h2>Đề đang có</h2><div class="panel-sub">Chọn “Bắt đầu làm bài” để thử trải nghiệm bài thi.</div></div></div>${exams.filter(e=>e.status==='Đang mở').map(e=>`<div class="exam-card"><div class="exam-symbol">📝</div><div class="exam-info"><h3>${esc(e.title)}</h3><div class="exam-meta"><span>${esc(e.subject)} · Lớp ${esc(e.grade)}</span><span>⏱ ${e.duration} phút</span><span>❔ ${e.questions} câu</span></div><div class="exam-actions"><button class="btn primary" data-action="start-quiz" data-id="${e.id}">Bắt đầu làm bài →</button></div></div></div>`).join('')||'<div class="empty">Hiện chưa có đề đang mở.</div>'}<div class="notice">⚠️ Khi vào thi thật, hãy kiểm tra đúng họ tên và lớp trước khi bắt đầu. Đồng hồ đếm ngược trong bản thử sẽ tự động nộp bài khi hết giờ.</div></section></div>`;bindActionsOnly()}
function startQuiz(id){let name=$('#studentName')?.value.trim(),cls=$('#studentClass')?.value;if(!name){toast('Bạn hãy nhập họ và tên trước khi bắt đầu.');$('#studentName')?.focus();return}let e=exams.find(x=>x.id===Number(id));if(!e||e.status!=='Đang mở'){toast('Đề này hiện không mở.');return}quizStudent={name,class:cls};activeQuiz=e;quizStart=Date.now();quizSeconds=e.duration*60;renderQuiz();clearInterval(quizTimer);quizTimer=setInterval(()=>{quizSeconds--;let t=$('#timerText');if(t)t.textContent=fmtTime(quizSeconds);if(quizSeconds<=0){clearInterval(quizTimer);submitQuiz(true)}},1000)}
function fmtTime(s){return String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0')}
function renderQuiz(){let main=$('#main'),e=activeQuiz;main.innerHTML=`<div class="student-shell"><div class="student-hero"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap"><div><div style="font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">BÀI KIỂM TRA TRỰC TUYẾN</div><h2>${esc(e.title)}</h2><div style="font-size:12px;opacity:.85">${esc(quizStudent.name)} · ${esc(quizStudent.class)} · ${e.duration} phút</div></div><div class="timer" id="timerText">${fmtTime(quizSeconds)}</div></div></div><form id="quizForm"><div class="notice">Đọc kỹ câu hỏi và chọn một đáp án cho mỗi câu. Bạn có thể nộp bài trước khi hết giờ.</div>${e.items.slice(0,Math.min(e.questions,e.items.length)).map((q,i)=>`<div class="quiz-q"><h3>Câu ${i+1}. ${esc(q.q)}</h3>${q.opts.map((op,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"> <span><b>${String.fromCharCode(65+j)}.</b> ${esc(op)}</span></label>`).join('')}</div>`).join('')}<div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="muted">Đã chọn <b id="answeredCount">0</b> / ${Math.min(e.questions,e.items.length)} câu</span><button class="btn primary" type="submit">Nộp bài kiểm tra ✓</button></div></form></div>`;$('#quizForm').querySelectorAll('input').forEach(i=>i.onchange=()=>{$('#answeredCount').textContent=new Set([...$('#quizForm').querySelectorAll('input:checked')].map(x=>x.name)).size});$('#quizForm').onsubmit=ev=>{ev.preventDefault();showModal(`<div class="modal-head"><div><h2>Nộp bài kiểm tra?</h2><div class="muted">Sau khi nộp, bạn sẽ xem được kết quả chấm tự động của bài mẫu.</div></div><button class="xbtn" data-close>×</button></div><div class="modal-footer"><button class="btn" data-close>Tiếp tục làm</button><button class="btn primary" id="confirmSubmit">Nộp bài</button></div>`);$('#confirmSubmit').onclick=()=>{closeModal();submitQuiz(false)}}}
function submitQuiz(auto){clearInterval(quizTimer);let e=activeQuiz,form=$('#quizForm'),correct=0,total=Math.min(e.questions,e.items.length);for(let i=0;i<total;i++){let sel=form?.querySelector(`input[name="q${i}"]:checked`);if(sel&&Number(sel.value)===e.items[i].ans)correct++}let duration=Math.max(1,Math.round((Date.now()-quizStart)/60000)),score=Math.round(correct/Math.max(1,total)*10*10)/10;let r={id:nextResult++,name:quizStudent.name,class:quizStudent.class,year:e.year,exam:e.title,subject:e.subject,score,duration,status:'Đã nộp',date:'27/10/2026',correct,total};results.unshift(r);activeQuiz=null;$('#main').innerHTML=`<div class="student-shell"><section class="panel" style="text-align:center;padding:32px 20px"><div style="font-size:48px">🎉</div><div class="eyebrow" style="margin-top:14px">${auto?'Đã tự động nộp bài':'Nộp bài thành công'}</div><h1 style="font-size:27px;margin:0 0 8px">Bài làm đã được ghi nhận!</h1><div class="muted">${esc(quizStudent.name)} · ${esc(quizStudent.class)} · ${esc(e.title)}</div><div class="result-score" style="margin-top:18px">${score}<span style="font-size:18px;color:light-dark(#748198,#aab6ca)"> / 10</span></div><div class="muted">Điểm chấm tự động theo đáp án của bộ câu hỏi mẫu</div><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:25px;text-align:left"><div class="stat"><div class="stat-top">Câu đúng</div><div class="stat-value">${correct}<span style="font-size:13px">/${total}</span></div></div><div class="stat"><div class="stat-top">Thời gian làm</div><div class="stat-value">${duration}<span style="font-size:12px"> phút</span></div></div><div class="stat"><div class="stat-top">Trạng thái</div><div style="margin-top:17px">${pill('Đã nộp')}</div></div></div><div class="notice" style="text-align:left">✓ Hệ thống đã ghi nhận lượt nộp bài trong phiên xem trước. Giáo viên có thể tìm kết quả trong mục <b>Kết quả học sinh</b>.</div><button class="btn primary" id="backStudent">Về trang làm bài</button> <button class="btn" id="backTeacher">Xem chế độ giáo viên</button></section></div>`;$('#backStudent').onclick=()=>renderStudentHome();$('#backTeacher').onclick=()=>{$('#roleSelect').value='teacher';setPage('results')}}
$('#roleSelect').onchange=()=>{if($('#roleSelect').value==='student')renderStudentHome();else render()};$('#resetDemo').onclick=()=>{exams=structuredClone(initialExams);results=structuredClone(initialResults);nextExam=3;nextResult=10;activeQuiz=null;clearInterval(quizTimer);$('#roleSelect').value='teacher';setPage('dashboard');toast('Đã khôi phục dữ liệu mẫu ban đầu.')};document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action="student-return"]');if(b){$('#roleSelect').value='teacher';setPage('dashboard')}let s=ev.target.closest('[data-action="start-quiz"]');if(s)startQuiz(s.dataset.id)});
render();
</script></body></html>
